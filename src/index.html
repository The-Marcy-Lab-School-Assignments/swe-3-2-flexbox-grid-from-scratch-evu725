<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Marcy Music</title>
</head>
<body>
    <header>
        <img src="img/logo.png" id="logo" alt="logo">
        <h1>Marcy Music</h1>
        <nav class="navbar">
            <ul>
                <li><a href="#">Library</a></li>
                <li><a href="#">Explore</a></li>
                <li><a href="#">Profile</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Playlists</h2>
            <ul class="playlists">
                <li>
                    <figure>
                        <img src="img/playlist-chill.jpg" alt="Chill playlist cover">
                        <figcaption>Chill Vibes</figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="img/playlist-focus.jpg" alt="Focus playlist cover">
                        <figcaption>Focus</figcaption>
                    </figure>               
                </li>
                <li>
                    <figure>
                        <img src="img/playlist-late-night.jpg" alt="Late night playlist cover">
                        <figcaption>Late Night</figcaption>
                    </figure>                 
                </li>
                <li>
                    <figure>
                        <img src="img/playlist-love.jpg" alt="Love songs playlist cover">
                        <figcaption>Love Songs</figcaption>
                    </figure>                   
                </li>
                <li>
                    <figure>
                        <img src="img/playlist-oldies.jpg" alt="Oldies playlist cover">
                        <figcaption>Oldies</figcaption>
                    </figure>                
                </li>
                <li>
                    <figure>
                        <img src="img/playlist-sad.jpg" alt="Sad playlist cover">
                        <figcaption>Sad</figcaption>
                    </figure>            
                </li>
            </ul>
        </section>
        <section>
            <h2 class="albums-heading">Albums</h2>
            <ul class="album">
                <li>
                    <figure>
                        <img src="img/album-midnight-dreams.jpg" alt="Album cover for Midnight Dreams">
                        <figcaption>
                            <h3 class="lp">Midnight Dreams</h3>
                            <p class="artist">Luna Ray</p>
                        </figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="img/album-electric-soul.jpg" alt="Album cover for Electric Soul">
                        <figcaption>
                            <h3 class="lp">Electric Soul</h3>
                            <p class="artist">The Voltage</p>
                        </figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="img/album-golden-hour.jpg" alt="Album cover for Golden Hour">
                        <figcaption>
                            <h3 class="lp">Golden Hour</h3>
                            <p class="artist">Sunset Collective</p>
                        </figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="img/album-kermit-does-jazz.jpg" alt="Album cover for Kermit Does Jazz">
                        <figcaption>
                            <h3 class="lp">Kermit Does Jazz</h3>
                            <p class="artist">Kermit the Frog</p>
                        </figcaption>
                    </figure>
                </li>
            </ul>
        </section>
    </main>
    <footer>
        <p>Made with ❤️ at <a href="https://www.marcylabschool.org">Marcy Lab School</a></p>
    </footer>
</body>
</html>
